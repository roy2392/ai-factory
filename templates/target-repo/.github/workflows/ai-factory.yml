name: AI Factory
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  workflow_run:
    workflows: [CI] # Replace with the target repository's CI workflow names.
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  self-heal:
    if: github.event_name == 'workflow_run'
    permissions:
      actions: read
      pull-requests: write
      issues: write
    uses: OWNER/ai-factory/.github/workflows/reusable-self-heal.yml@v1
    with:
      factory_repo: OWNER/ai-factory
    secrets:
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
  watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    uses: OWNER/ai-factory/.github/workflows/reusable-watchdog.yml@v1
    with:
      factory_repo: OWNER/ai-factory
    secrets:
      FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
  ai-command:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: read
      issues: write
    uses: OWNER/ai-factory/.github/workflows/reusable-ai-command.yml@v1
    with:
      factory_repo: OWNER/ai-factory
    secrets: inherit
  dispatch:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: OWNER/ai-factory/.github/workflows/reusable-dispatch.yml@v1
    with:
      factory_repo: OWNER/ai-factory
    secrets: inherit
  automerge:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: OWNER/ai-factory/.github/workflows/reusable-automerge.yml@v1
    with:
      factory_repo: OWNER/ai-factory
    secrets: inherit
