<text x="24" y="36" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1F2A44">Scenario 3: review of a pull request</text>
<text x="24" y="58" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6678">Review comments go straight to Copilot. When CI fails, self-heal sends Copilot the log, up to a limit, then asks a human.</text>
