name: Factory auto-merge
on:
  workflow_call:
    inputs:
      factory_repo:
        type: string
        required: true
      factory_ref:
        type: string
        default: v1
    secrets:
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true
      COPILOT_ASSIGN_TOKEN:
        required: false # Declared for the shared contract; never exposed to this job.
permissions: {}
concurrency:
  group: ai-factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Resolve repositories
        id: repos
        env:
          FACTORY_REPO: ${{ inputs.factory_repo }}
        shell: bash
        run: |
          if [[ "$FACTORY_REPO" != "$GITHUB_REPOSITORY_OWNER/"* ]]; then
            echo '::error::The factory and target repositories must share an owner for one installation token.'
            exit 1
          fi
          echo "factory=${FACTORY_REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ steps.repos.outputs.target }}
            ${{ steps.repos.outputs.factory }}
          permission-contents: read
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .factory/package-lock.json
      - run: npm ci
        working-directory: .factory
      - run: npx --no-install tsx src/cli.ts automerge
        working-directory: .factory
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          COPILOT_BOT_LOGIN: ${{ vars.COPILOT_BOT_LOGIN }}
