name: Factory metrics
on:
  workflow_call:
    inputs:
      factory_repo:
        type: string
        required: true
      factory_ref:
        type: string
        default: v1
      since:
        type: string
        default: 30d
    secrets:
      FACTORY_APP_ID:
        required: true
      FACTORY_APP_PRIVATE_KEY:
        required: true
permissions: {}
concurrency:
  group: ai-factory-metrics-${{ github.repository }}
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Resolve repositories
        id: repos
        env:
          FACTORY_REPO: ${{ inputs.factory_repo }}
        shell: bash
        run: |
          if [[ "$FACTORY_REPO" != "$GITHUB_REPOSITORY_OWNER/"* ]]; then
            echo '::error::The factory and target repositories must share an owner for one installation token.'
            exit 1
          fi
          echo "factory=${FACTORY_REPO#*/}" >> "$GITHUB_OUTPUT"
          echo "target=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ steps.repos.outputs.target }}
            ${{ steps.repos.outputs.factory }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: .factory
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .factory/package-lock.json
      - run: npm ci
        working-directory: .factory
      - run: npx --no-install tsx src/cli.ts metrics --repo "$REPO" --since "$SINCE" --output-dir out
        working-directory: .factory
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_APP_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          COPILOT_BOT_LOGIN: ${{ vars.COPILOT_BOT_LOGIN }}
          REPO: ${{ github.repository }}
          SINCE: ${{ inputs.since }}
      - uses: actions/upload-artifact@v4
        with:
          name: factory-metrics-${{ github.run_id }}
          path: .factory/out/metrics.json
          overwrite: true
          retention-days: 30
          if-no-files-found: error
