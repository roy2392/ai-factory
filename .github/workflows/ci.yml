name: CI
on: [push, pull_request]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify the pinned Copilot CLI flags
        run: |
          npx --yes @github/copilot@1.0.112 --no-auto-update --version
          npx --yes @github/copilot@1.0.112 --no-auto-update --help
          npx --yes @github/copilot@1.0.112 --no-auto-update help permissions
      - name: Lint workflows and templates
        shell: bash
        run: |
          # rhysd/actionlint v1.7.7; pin the download script to its full release commit.
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/rhysd/actionlint/03d0035246f3e81f36aed592ffb4bebf33a03106/scripts/download-actionlint.bash -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.7 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml templates/target-repo/.github/workflows/*.yml
